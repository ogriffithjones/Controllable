name: Build 26.3 port
on:
  push:
    branches: ['port/26.3']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [fabric, neoforge]
    env:
      TARGET_LOADER: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: controllable-${{ matrix.loader }}-26.3
          path: build/26.3-mods/${{ matrix.loader }}/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: patched-framework-source-${{ matrix.loader }}
          path: build/26.3-sources/*.tar.gz
          if-no-files-found: error
